[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protohgf-net"
dynamic = ["version"]
description = "Prototype HyperGraph Fusion with Intra-modal Calibration for RGBT object detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
keywords = ["RGBT", "object-detection", "hypergraph", "knowledge-distillation"]
authors = [{ name = "ProtoHGF-Net Authors" }]
dependencies = [
    "matplotlib>=3.3.0",
    "numpy>=1.23.0",
    "opencv-python>=4.6.0",
    "pandas>=1.1.4",
    "pillow>=7.1.2",
    "psutil",
    "py-cpuinfo",
    "pyyaml>=5.3.1",
    "requests>=2.23.0",
    "scipy>=1.4.1",
    "seaborn>=0.11.0",
    "torch>=2.3.0,<2.4.0",
    "torchvision>=0.18.0,<0.19.0",
    "tqdm>=4.64.0",
    "thop>=0.1.1",
]

[project.urls]
Paper = "https://doi.org/10.1145/3767308.3835030"

[tool.setuptools]
packages = { find = { where = ["."], include = ["ultralytics", "ultralytics.*"] } }
package-data = { ultralytics = ["**/*.yaml"] }

[tool.setuptools.dynamic]
version = { attr = "ultralytics.__version__" }

[tool.ruff]
line-length = 120
