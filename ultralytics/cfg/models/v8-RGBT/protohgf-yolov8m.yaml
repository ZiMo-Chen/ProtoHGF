# ProtoHGF-Net with a YOLOv8m HBB detection head.
# ProtoHGFusion args: [num_prototypes=6, k_intra=3, k_cross=3].
ch: 6
nc: 3
scales:
  m: [0.67, 0.75, 768]

backbone:
  - [-1, 1, IN, []]
  - [-1, 1, Multiin, [1]]
  - [-2, 1, Multiin, [2]]

  - [-2, 1, Conv, [64, 3, 2]]
  - [-2, 1, Conv, [64, 3, 2]]
  - [-2, 1, Conv, [128, 3, 2]]
  - [-2, 1, Conv, [128, 3, 2]]
  - [-2, 3, C2f, [128, True]]
  - [-2, 3, C2f, [128, True]]

  - [-2, 1, Conv, [256, 3, 2]]
  - [-2, 1, Conv, [256, 3, 2]]
  - [-2, 6, C2f, [256, True]]
  - [-2, 6, C2f, [256, True]]
  - [[-1, -2], 1, ProtoHGFusion, [6, 3, 3]]

  - [-3, 1, Conv, [512, 3, 2]]
  - [-3, 1, Conv, [512, 3, 2]]
  - [-2, 6, C2f, [512, True]]
  - [-2, 6, C2f, [512, True]]
  - [[-1, -2], 1, ProtoHGFusion, [6, 3, 3]]

  - [-3, 1, Conv, [1024, 3, 2]]
  - [-3, 1, Conv, [1024, 3, 2]]
  - [-2, 3, C2f, [1024, True]]
  - [-2, 3, C2f, [1024, True]]
  - [[-1, -2], 1, ProtoHGFusion, [6, 3, 3]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 18], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 27], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 23], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[30, 33, 36], 1, Detect, [nc]]
